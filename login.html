<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin | E07 IMPORTS </title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Acesso restrito ao painel administrativo.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a2a6e'/%3E%3Ctext x='50' y='68' font-family='Arial,sans-serif' font-size='55' font-weight='900' fill='%23fbbf24' text-anchor='middle'%3ES7%3C/text%3E%3C/svg%3E">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --cobalt-deep: #0a2a6e;
            --cobalt-main: #1a4fb8;
            --cobalt-bright: #2563eb;
            --cobalt-light: #60a5fa;
            --gold: #fbbf24;
            --gold-dark: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;
            --bg-white: #ffffff;
            --bg-light: #f8fafc;
            --text-dark: #0f172a;
            --text-gray: #64748b;
            --border: #e2e8f0;
            --radius: 8px;
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, var(--cobalt-deep) 0%, var(--cobalt-main) 50%, var(--cobalt-bright) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Formas decorativas animadas */
        body::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }
        body::after {
            content: '';
            position: absolute;
            bottom: -100px;
            left: -100px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(96, 165, 250, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 8s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 10;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            padding: 48px 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-logo .logo-text {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--cobalt-deep);
            letter-spacing: -0.02em;
        }
        .login-logo .logo-text span {
            background: linear-gradient(135deg, var(--cobalt-main), var(--cobalt-bright));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .login-logo .subtitle {
            color: var(--text-gray);
            font-size: 0.95rem;
            margin-top: 8px;
            font-weight: 500;
        }
        .login-logo .admin-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--cobalt-deep);
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 12px;
        }

        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
        }
        .form-group label .req {
            color: var(--danger);
        }

        .input-wrapper {
            position: relative;
        }
        .input-wrapper .icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            color: var(--text-gray);
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 0.95rem;
            transition: var(--transition);
            background: var(--bg-light);
        }
        .form-input:focus {
            outline: none;
            border-color: var(--cobalt-main);
            background: white;
            box-shadow: 0 0 0 4px rgba(26, 79, 184, 0.1);
        }
        .form-input.error {
            border-color: var(--danger);
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--text-gray);
            transition: var(--transition);
            padding: 4px;
        }
        .password-toggle:hover {
            color: var(--cobalt-main);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 0.85rem;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-gray);
            cursor: pointer;
        }
        .remember-me input {
            width: 16px;
            height: 16px;
            accent-color: var(--cobalt-main);
            cursor: pointer;
        }
        .forgot-link {
            color: var(--cobalt-main);
            font-weight: 600;
            text-decoration: none;
            background: none;
            border: none;
            font-family: inherit;
            font-size: inherit;
            cursor: pointer;
        }
        .forgot-link:hover {
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--cobalt-main), var(--cobalt-bright));
            color: white;
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(26, 79, 184, 0.3);
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(26, 79, 184, 0.4);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .btn-login:disabled {
            background: var(--text-gray);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .error-message.show {
            display: flex;
        }

        .success-message {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .success-message.show {
            display: flex;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: var(--text-gray);
            font-size: 0.8rem;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .divider::before { margin-right: 12px; }
        .divider::after { margin-left: 12px; }

        .back-link {
            text-align: center;
            margin-top: 24px;
        }
        .back-link a {
            color: var(--text-gray);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .back-link a:hover {
            color: var(--cobalt-main);
        }

        .security-info {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            color: var(--text-gray);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
        }

        /* Modo recuperação de senha */
        .recovery-mode .login-logo .admin-badge {
            background: var(--text-gray);
            color: white;
        }

        @media (max-width: 480px) {
            body { padding: 16px; }
            .login-card { padding: 36px 24px; }
            .login-logo .logo-text { font-size: 2rem; }
            .form-options { flex-direction: column; gap: 12px; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-text">S<span>7</span>TE</div>
                <div class="subtitle" id="card-subtitle">Painel Administrativo</div>
                <div class="admin-badge" id="card-badge">🔐 Área Restrita</div>
            </div>

            <div class="error-message" id="error-message">
                <span>⚠️</span>
                <span id="error-text">E-mail ou senha incorretos</span>
            </div>

            <div class="success-message" id="success-message">
                <span>✅</span>
                <span id="success-text">Login realizado com sucesso!</span>
            </div>

            <!-- FORMULÁRIO DE LOGIN -->
            <form id="login-form">
                <div class="form-group">
                    <label>E-mail <span class="req">*</span></label>
                    <div class="input-wrapper">
                        <span class="icon">📧</span>
                        <input 
                            type="email" 
                            class="form-input" 
                            id="email" 
                            placeholder="admin@s7te.com.br"
                            required
                            autocomplete="email"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label>Senha <span class="req">*</span></label>
                    <div class="input-wrapper">
                        <span class="icon">🔒</span>
                        <input 
                            type="password" 
                            class="form-input" 
                            id="senha" 
                            placeholder="••••••••"
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" class="password-toggle" onclick="togglePassword()" id="toggle-btn" aria-label="Mostrar senha">👁️</button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember" checked>
                        <span>Lembrar de mim</span>
                    </label>
                    <button type="button" class="forgot-link" onclick="mostrarRecuperacao()">Esqueci a senha</button>
                </div>

                <button type="submit" class="btn-login" id="btn-login">
                    <span id="btn-text">Entrar</span>
                </button>
            </form>

            <!-- FORMULÁRIO DE RECUPERAÇÃO -->
            <form id="recovery-form" style="display: none;">
                <div class="form-group">
                    <label>E-mail cadastrado <span class="req">*</span></label>
                    <div class="input-wrapper">
                        <span class="icon">📧</span>
                        <input 
                            type="email" 
                            class="form-input" 
                            id="recovery-email" 
                            placeholder="admin@s7te.com.br"
                            required
                            autocomplete="email"
                        >
                    </div>
                </div>

                <button type="submit" class="btn-login" id="btn-recovery">
                    <span id="btn-recovery-text">📧 Enviar link de recuperação</span>
                </button>

                <div class="back-link">
                    <button type="button" class="forgot-link" onclick="voltarParaLogin()">← Voltar para o login</button>
                </div>
            </form>

            <div class="divider">ou</div>

            <div class="back-link">
                <a href="https://demonsites.github.io/sete
                    ">← Voltar para a loja</a>
            </div>

            <div class="security-info">
                🔒 Conexão segura e criptografada
            </div>
        </div>

        <div class="login-footer">
            © 2026 S7TE Tecnologia em Odontologia
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURAÇÃO SUPABASE
        // ============================================
        const SUPABASE_URL = 'https://ksqutwabqqkkthpqdpqo.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzcXV0d2FicXFra3RocHFkcHFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3Mzc3MTQsImV4cCI6MjEwNDMxMzcxNH0.zctTCekjtWs7jElZoEIddw6UbEpTOqklnJS54uufGlY';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================
        // HELPERS
        // ============================================
        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function mostrarErro(mensagem) {
            const errorMsg = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            const successMsg = document.getElementById('success-message');
            
            successMsg.classList.remove('show');
            errorText.textContent = mensagem;
            errorMsg.classList.add('show');
        }

        function mostrarSucesso(mensagem) {
            const errorMsg = document.getElementById('error-message');
            const successMsg = document.getElementById('success-message');
            const successText = document.getElementById('success-text');
            
            errorMsg.classList.remove('show');
            successText.textContent = mensagem;
            successMsg.classList.add('show');
        }

        function limparMensagens() {
            document.getElementById('error-message').classList.remove('show');
            document.getElementById('success-message').classList.remove('show');
        }

        // ============================================
        // VERIFICAR SESSÃO EXISTENTE
        // ============================================
        async function verificarSessao() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) {
                    // Já está logado, redireciona direto para o admin
                    window.location.href = 'admin.html';
                }
            } catch (error) {
                console.error('Erro ao verificar sessão:', error);
            }
        }

        // ============================================
        // TOGGLE SENHA
        // ============================================
        function togglePassword() {
            const senhaInput = document.getElementById('senha');
            const toggleBtn = document.getElementById('toggle-btn');
            
            if (senhaInput.type === 'password') {
                senhaInput.type = 'text';
                toggleBtn.textContent = '🙈';
                toggleBtn.setAttribute('aria-label', 'Ocultar senha');
            } else {
                senhaInput.type = 'password';
                toggleBtn.textContent = '👁️';
                toggleBtn.setAttribute('aria-label', 'Mostrar senha');
            }
        }

        // ============================================
        // LOGIN
        // ============================================
        async function fazerLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const btn = document.getElementById('btn-login');
            const btnText = document.getElementById('btn-text');

            limparMensagens();

            if (!email || !senha) {
                mostrarErro('Preencha todos os campos');
                return;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
                mostrarErro('E-mail inválido');
                return;
            }

            btn.disabled = true;
            btnText.innerHTML = '<div class="spinner"></div> Entrando...';

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: senha
                });

                if (error) throw error;

                mostrarSucesso('Login realizado! Redirecionando...');

                // Redireciona após pequeno delay
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 800);

            } catch (error) {
                console.error('Erro no login:', error);
                
                let mensagemErro = 'E-mail ou senha incorretos';
                
                if (error.message.includes('Invalid login credentials')) {
                    mensagemErro = 'E-mail ou senha incorretos';
                } else if (error.message.includes('Email not confirmed')) {
                    mensagemErro = 'E-mail não confirmado. Verifique sua caixa de entrada.';
                } else if (error.message.includes('rate limit') || error.message.includes('too many')) {
                    mensagemErro = 'Muitas tentativas. Aguarde alguns minutos.';
                } else if (error.message.includes('network') || error.message.includes('fetch')) {
                    mensagemErro = 'Erro de conexão. Verifique sua internet.';
                }

                mostrarErro(mensagemErro);

                btn.disabled = false;
                btnText.textContent = 'Entrar';

                // Limpa senha e foca
                document.getElementById('senha').value = '';
                document.getElementById('senha').focus();
            }
        }

        // ============================================
        // RECUPERAÇÃO DE SENHA
        // ============================================
        function mostrarRecuperacao() {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('recovery-form').style.display = 'block';
            document.getElementById('card-subtitle').textContent = 'Recuperar Senha';
            document.getElementById('card-badge').textContent = '🔑 Recuperação';
            document.getElementById('card-badge').style.background = 'var(--text-gray)';
            document.getElementById('card-badge').style.color = 'white';
            limparMensagens();
        }

        function voltarParaLogin() {
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('recovery-form').style.display = 'none';
            document.getElementById('card-subtitle').textContent = 'Painel Administrativo';
            document.getElementById('card-badge').textContent = '🔐 Área Restrita';
            document.getElementById('card-badge').style.background = 'linear-gradient(135deg, var(--gold), var(--gold-dark))';
            document.getElementById('card-badge').style.color = 'var(--cobalt-deep)';
            limparMensagens();
        }

        async function recuperarSenha(event) {
            event.preventDefault();
            
            const email = document.getElementById('recovery-email').value.trim();
            const btn = document.getElementById('btn-recovery');
            const btnText = document.getElementById('btn-recovery-text');

            limparMensagens();

            if (!email) {
                mostrarErro('Digite seu e-mail para recuperar a senha');
                return;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
                mostrarErro('E-mail inválido');
                return;
            }

            btn.disabled = true;
            btnText.innerHTML = '<div class="spinner"></div> Enviando...';

            try {
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/login.html'
                });

                if (error) throw error;

                mostrarSucesso('📧 E-mail de recuperação enviado! Verifique sua caixa de entrada.');
                document.getElementById('recovery-email').value = '';

            } catch (error) {
                console.error('Erro ao recuperar senha:', error);
                mostrarErro('Erro ao enviar e-mail de recuperação. Tente novamente.');
            } finally {
                btn.disabled = false;
                btnText.textContent = '📧 Enviar link de recuperação';
            }
        }

        // ============================================
        // INICIALIZAÇÃO
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            verificarSessao();
            
            // Foca no campo de email
            document.getElementById('email').focus();

            // Event listeners
            document.getElementById('login-form').addEventListener('submit', fazerLogin);
            document.getElementById('recovery-form').addEventListener('submit', recuperarSenha);
        });
    </script>
</body>
</html>
