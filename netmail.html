<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netmail | E-mail Profissional</title>
    <!-- Fonte Inter para visual profissional -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
    <style>
        /* Scrollbar suave e moderna */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .nav-item.active { background-color: #eef2ff; color: #4f46e5; font-weight: 600; border-right: 3px solid #4f46e5; }
        .nav-item { color: #475569; transition: all 0.2s; }
        .nav-item:hover { background-color: #f8fafc; color: #1e293b; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex overflow-hidden">

    <!-- BARRA LATERAL (Sidebar) -->
    <aside class="w-64 bg-white border-r border-slate-200 flex-shrink-0 hidden md:flex flex-col">
        <div class="p-6 border-b border-slate-100">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-500 to-purple-600 flex items-center justify-center text-white font-bold text-lg shadow-md shadow-brand-500/20">N</div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 tracking-tight">Netmail</h1>
                    <p class="text-xs text-slate-500 font-medium">e07imports.com.br</p>
                </div>
            </div>
        </div>

        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
            <button onclick="switchTab('inbox')" id="nav-inbox" class="nav-item active w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                Caixa de Entrada
            </button>
            <button onclick="switchTab('compose')" id="nav-compose" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                Novo E-mail
            </button>
            <button onclick="switchTab('create')" id="nav-create" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
                Criar Conta
            </button>
        </nav>

        <div class="p-4 border-t border-slate-100">
            <div class="bg-slate-50 rounded-lg p-3 border border-slate-200">
                <p class="text-xs text-slate-500 mb-1">Status do Domínio</p>
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="text-sm font-semibold text-slate-700">Verificado ✅</span>
                </div>
            </div>
        </div</aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
        
        <!-- Header Mobile (visível apenas em telas pequenas) -->
        <header class="md:hidden bg-white border-b border-slate-200 p-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center text-white font-bold">N</div>
                <span class="font-bold text-slate-900">Netmail</span>
            </div>
            <button onclick="document.querySelector('aside').classList.toggle('hidden'); document.querySelector('aside').classList.toggle('absolute'); document.querySelector('aside').classList.toggle('z-50'); document.querySelector('aside').classList.toggle('h-full');" class="text-slate-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </header>

        <!-- ÁREA DE CONTEÚDO DINÂMICO -->
        <div class="flex-1 overflow-y-auto p-4 md:p-8">
            
            <!-- 1. CAIXA DE ENTRADA -->
            <div id="view-inbox" class="max-w-4xl mx-auto">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-slate-900">Caixa de Entrada</h2>
                    <button onclick="loadInbox()" class="flex items-center gap-2 text-sm text-brand-600 hover:text-brand-700 font-medium bg-brand-50 hover:bg-brand-100 px-3 py-1.5 rounded-md transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        Atualizar
                    </button>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div id="inbox-list" class="divide-y divide-slate-100">
                        <!-- Conteúdo injetado via JS -->
                        <div class="p-12 text-center">
                            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-100 mb-4">
                                <svg class="w-8 h-8 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                            </div>
                            <p class="text-slate-500 font-medium">Carregando suas mensagens...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. COMPOR E-MAIL -->
            <div id="view-compose" class="hidden max-w-3xl mx-auto">
                <h2 class="text-2xl font-bold text-slate-900 mb-6">Novo E-mail</h2>
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 md:p-8">
                    <form id="email-form" class="space-y-5">
                        <div class="grid md:grid-cols-2 gap-5">
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-1.5">De</label>
                                <select id="from-email-select" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all text-sm">
                                    <option>Carregando contas...</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Para</label>
                                <input type="email" id="to-email" required placeholder="destinatario@exemplo.com" 
                                    class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all text-sm">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Assunto</label>
                            <input type="text" id="subject" required placeholder="Qual o assunto desta mensagem?" 
                                class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Mensagem</label>
                            <textarea id="body" rows="8" required placeholder="Escreva sua mensagem aqui..." 
                                class="w-full px-3 py-3 bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all text-sm resize-none"></textarea>
                        </div>
                        <div class="flex items-center justify-between pt-2 border-t border-slate-100">
                            <p id="status-msg" class="text-sm font-medium"></p>
                            <button type="submit" id="send-btn" class="bg-brand-600 hover:bg-brand-700 text-white px-6 py-2.5 rounded-lg font-semibold text-sm transition-all flex items-center gap-2 shadow-sm shadow-brand-500/30">
                                <span>Enviar E-mail</span>
                                <svg id="loading-spinner" class="hidden animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 3. CRIAR CONTA -->
            <div id="view-create" class="hidden max-w-2xl mx-auto">
                <h2 class="text-2xl font-bold text-slate-900 mb-6">Gerenciar Contas</h2>
                
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 md:p-8 mb-8">
                    <h3 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                        <span class="w-8 h-8 rounded-lg bg-brand-100 text-brand-600 flex items-center justify-center text-sm">+</span>
                        Criar Nova Conta
                    </h3>
                    <form id="create-account-form" class="space-y-5">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Nome de Usuário</label>
                            <div class="flex">
                                <input type="text" id="new-username" required placeholder="ex: joao.silva" 
                                    class="flex-1 px-3 py-2.5 bg-white border border-r-0 border-slate-200 rounded-l-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all text-sm">
                                <span class="inline-flex items-center px-4 rounded-r-lg border border-l-0 border-slate-200 bg-slate-50 text-slate-500 text-sm font-medium" id="domain-display">
                                    @e07imports.com.br
                                </span>
                            </div>
                        </div>
                        <div class="grid md:grid-cols-2 gap-5">
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Senha</label>
                                <input type="password" id="new-password" required placeholder="Mínimo 6 caracteres" 
                                    class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all text-sm">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Nome Completo <span class="text-slate-400 font-normal">(Opcional)</span></label>
                                <input type="text" id="new-fullname" placeholder="João da Silva" 
                                    class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all text-sm">
                            </div>
                        </div>
                        <div class="flex items-center justify-between pt-2">
                            <p id="create-status-msg" class="text-sm font-medium"></p>
                            <button type="submit" id="create-btn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-lg font-semibold text-sm transition-all flex items-center gap-2 shadow-sm shadow-emerald-500/30">
                                <span>Criar Conta</span>
                                <svg id="create-spinner" class="hidden animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                            </button>
                        </div>
                    </form>
                </div>

                <div>
                    <h3 class="text-lg font-bold text-slate-900 mb-4">Contas Ativas</h3>
                    <div id="accounts-list" class="space-y-3">
                        <p class="text-slate-500 text-sm text-center py-4 bg-white rounded-xl border border-slate-200 border-dashed">Carregando contas...</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // 1. CONFIGURAÇÃO
        const SUPABASE_URL = 'https://enhasmqjniyplrajdbkh.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVuaGFzbXFqbml5cGxyYWpkYmtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0ODkyNzgsImV4cCI6MjEwNTA2NTI3OH0.Ax9sm3lItl0Zv_r7RjE9HYTlvh9qnJMmLkbkiNl0z-4';
        const MAIN_DOMAIN = 'e07imports.com.br'; 

        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. INICIALIZAÇÃO
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('domain-display').textContent = `@${MAIN_DOMAIN}`;
            loadAccounts();
            loadInbox();
        });

        // Helper para pegar iniciais do e-mail
        function getInitials(email) {
            return email.charAt(0).toUpperCase();
        }

        // 3. FUNÇÕES DE INTERFACE
        function switchTab(tab) {
            // Esconde todas as views
            ['inbox', 'compose', 'create'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).classList.remove('active');
            });

            // Mostra a view selecionada
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.getElementById(`nav-${tab}`).classList.add('active');

            if (tab === 'inbox') loadInbox();
            if (tab === 'create') loadAccounts();
        }

        function formatDateTime(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const isToday = date.toDateString() === now.toDateString();
            
            if (isToday) {
                return date.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            }
            return date.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });
        }

        // 4. CARREGAR CONTAS
        async function loadAccounts() {
            const listEl = document.getElementById('accounts-list');
            const selectEl = document.getElementById('from-email-select');
            
            listEl.innerHTML = '<p class="text-slate-500 text-sm text-center py-4 bg-white rounded-xl border border-slate-200 border-dashed">Carregando...</p>';
            selectEl.innerHTML = '<option>Carregando...</option>';

            const { data, error } = await sb.from('email_accounts').select('*').order('created_at', { ascending: false });

            if (error || !data || data.length === 0) {
                listEl.innerHTML = '<p class="text-slate-500 text-sm text-center py-8 bg-white rounded-xl border border-slate-200 border-dashed">Nenhuma conta criada ainda.</p>';
                selectEl.innerHTML = `<option value="contato@${MAIN_DOMAIN}">contato@${MAIN_DOMAIN} (Exemplo)</option>`;
                return;
            }

            listEl.innerHTML = data.map(acc => `
                <div class="flex justify-between items-center bg-white p-4 rounded-xl border border-slate-200 hover:border-brand-300 transition-colors group">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-brand-100 text-brand-600 flex items-center justify-center font-bold text-sm">${getInitials(acc.email)}</div>
                        <div>
                            <p class="font-semibold text-slate-900">${acc.email}</p>
                            <p class="text-xs text-slate-500">Criado em ${formatDateTime(acc.created_at)}</p>
                        </div>
                    </div>
                    <span class="bg-emerald-50 text-emerald-700 text-xs font-semibold px-2.5 py-1 rounded-full border border-emerald-100">Ativo</span>
                </div>
            `).join('');

            selectEl.innerHTML = data.map(acc => `<option value="${acc.email}">${acc.email}</option>`).join('');
        }

        // 5. CRIAR CONTA
        document.getElementById('create-account-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('new-username').value.trim().toLowerCase();
            const password = document.getElementById('new-password').value;
            const fullname = document.getElementById('new-fullname').value.trim();
            const newEmail = `${username}@${MAIN_DOMAIN}`;
            
            const statusMsg = document.getElementById('create-status-msg');
            const createBtn = document.getElementById('create-btn');
            const spinner = document.getElementById('create-spinner');

            if (password.length < 6) {
                statusMsg.textContent = '❌ A senha deve ter pelo menos 6 caracteres.';
                statusMsg.className = 'text-sm font-medium text-red-600';
                return;
            }

            createBtn.disabled = true;
            spinner.classList.remove('hidden');
            statusMsg.textContent = 'Processando...';
            statusMsg.className = 'text-sm font-medium text-brand-600';

            try {
                const { error } = await sb.from('email_accounts').insert({
                    email: newEmail, password_hash: password, fullname: fullname || username, status: 'active'
                });

                if (error) throw error;

                statusMsg.textContent = `✅ Conta ${newEmail} criada com sucesso!`;
                statusMsg.className = 'text-sm font-medium text-emerald-600';
                document.getElementById('create-account-form').reset();
                
                setTimeout(() => {
                    statusMsg.textContent = '';
                    loadAccounts();
                }, 1500);

            } catch (err) {
                statusMsg.textContent = `❌ Erro: ${err.message}`;
                statusMsg.className = 'text-sm font-medium text-red-600';
            } finally {
                createBtn.disabled = false;
                spinner.classList.add('hidden');
            }
        });

        // 6. ENVIAR E-MAIL
        document.getElementById('email-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const from = document.getElementById('from-email-select').value;
            const to = document.getElementById('to-email').value;
            const subject = document.getElementById('subject').value;
            const body = document.getElementById('body').value;
            
            const statusMsg = document.getElementById('status-msg');
            const sendBtn = document.getElementById('send-btn');
            const spinner = document.getElementById('loading-spinner');

            sendBtn.disabled = true;
            spinner.classList.remove('hidden');
            statusMsg.textContent = 'Enviando...';
            statusMsg.className = 'text-sm font-medium text-brand-600';

            try {
                const { error } = await sb.functions.invoke('send-email', { body: { to, subject, body, from } });
                if (error) throw error;

                statusMsg.textContent = '✅ Enviado com sucesso!';
                statusMsg.className = 'text-sm font-medium text-emerald-600';
                document.getElementById('email-form').reset();
                
                setTimeout(() => {
                    statusMsg.textContent = '';
                    switchTab('inbox');
                }, 1500);

            } catch (err) {
                statusMsg.textContent = `❌ Erro: ${err.message || 'Falha na conexão'}`;
                statusMsg.className = 'text-sm font-medium text-red-600';
            } finally {
                sendBtn.disabled = false;
                spinner.classList.add('hidden');
            }
        });

        // 7. CARREGAR CAIXA DE ENTRADA
        async function loadInbox() {
            const listEl = document.getElementById('inbox-list');
            listEl.innerHTML = `<div class="p-12 text-center"><div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-brand-600 mb-4"></div><p class="text-slate-500">Sincronizando...</p></div>`;

            const { data, error } = await sb.from('emails').select('*').eq('direction', 'inbound').order('created_at', { ascending: false }).limit(50);

            if (error) {
                listEl.innerHTML = `<div class="p-8 text-center text-red-500 bg-red-50 m-4 rounded-lg">Erro ao carregar: ${error.message}</div>`;
                return;
            }

            if (!data || data.length === 0) {
                listEl.innerHTML = `
                    <div class="p-16 text-center">
                        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-100 mb-4">
                            <svg class="w-8 h-8 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                        </div>
                        <p class="text-slate-900 font-semibold mb-1">Sua caixa de entrada está vazia</p>
                        <p class="text-slate-500 text-sm">Quando você receber novos e-mails, eles aparecerão aqui.</p>
                    </div>`;
                return;
            }

            listEl.innerHTML = data.map(email => `
                <div class="group flex items-start gap-4 p-4 hover:bg-slate-50 cursor-pointer transition-colors border-l-4 border-transparent hover:border-brand-500">
                    <div class="w-10 h-10 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center font-bold text-sm flex-shrink-0 group-hover:bg-brand-100 group-hover:text-brand-600 transition-colors">
                        ${getInitials(email.from_email)}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-baseline mb-1">
                            <span class="font-semibold text-slate-900 truncate pr-4">${email.from_email}</span>
                            <span class="text-xs text-slate-500 flex-shrink-0 font-medium">${formatDateTime(email.created_at)}</span>
                        </div>
                        <p class="text-sm font-semibold text-slate-800 truncate mb-1">${email.subject || 'Sem assunto'}</p>
                        <p class="text-sm text-slate-500 truncate leading-relaxed">${email.body}</p>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
